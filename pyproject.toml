[project]
name = "orchestra"
version = "0.1.0"
description = "Claude Desktop orchestrating concurrent Claude Code workers via a FastMCP server and filesystem blackboard"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
